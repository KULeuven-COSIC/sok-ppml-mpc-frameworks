name: Create Anonymous Submission Branch

# Manually triggered only. Builds a scrubbed, single-commit snapshot of
# main's current content on the `anonymous-submission` branch, for sharing
# with reviewers via a URL-masking proxy (e.g. anonymous.4open.science) --
# NOT by sharing the raw GitHub URL of this repo, since that alone would
# reveal the KULeuven-COSIC affiliation regardless of what this workflow
# scrubs from the file content.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  anonymize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Capture live-site screenshots for the anonymized README
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium

          mkdir -p docs/website-preview
          # Written into the repo working directory (not /tmp) so that Node's module
          # resolution can find ./node_modules/playwright -- a script outside the
          # repo tree has no relation to where `npm install` put the package.
          cat > capture.js <<'EOF'
          const { chromium } = require('playwright');

          const BASE = 'https://kuleuven-cosic.github.io/sok-ppml-mpc-frameworks';
          const PAGES = {
            '': 'home',
            'explorer': 'explorer',
            'cost-analysis': 'cost-analysis',
            'genealogy': 'genealogy',
            'mpc-puzzle': 'mpc-puzzle',
            'related-work': 'related-work',
            'bibliography': 'bibliography',
          };

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            for (const [slug, file] of Object.entries(PAGES)) {
              const url = `${BASE}/${slug}`;
              await page.goto(url, { waitUntil: 'networkidle' });
              // The live site is the real, non-anonymized deployment -- these elements
              // bake author names / institution / eprint ID directly into the rendered
              // page, so they have to be hidden before the screenshot is taken, not
              // after (a PNG has no text to scrub once captured).
              await page.evaluate(() => {
                // Shared footer on every page: full author list, eprint ID, org/repo name.
                document.querySelectorAll('footer').forEach(el => { el.style.display = 'none'; });
                // Homepage-only "Citation" section: has a stable id on the <pre> block itself,
                // which is a more reliable hook than text-matching -- hide its nearest <section>.
                const citationBlock = document.getElementById('citation-block');
                if (citationBlock) {
                  const section = citationBlock.closest('section');
                  if (section) section.style.display = 'none';
                }
                // Homepage-only "Authors" section: institutions + author cards (a separate
                // section from the citation block above, not nested inside it).
                document.querySelectorAll('section').forEach(el => {
                  const text = el.textContent || '';
                  if (text.includes('KU Leuven COSIC') && text.includes('Technology Innovation Institute')) {
                    el.style.display = 'none';
                  }
                });
                // Homepage hero badge, e.g. "ePrint 2025/1679 · KU Leuven COSIC". Not a pure
                // leaf (it wraps an icon element), so match the deepest element whose own
                // text contains the full pattern -- i.e. none of its children match it too.
                document.querySelectorAll('body *').forEach(el => {
                  const text = el.textContent || '';
                  if (/ePrint\s+\d{4}\/\d+\s*·\s*KU Leuven/i.test(text)) {
                    const childMatches = Array.from(el.children).some(
                      c => /ePrint\s+\d{4}\/\d+\s*·\s*KU Leuven/i.test(c.textContent || '')
                    );
                    if (!childMatches) el.style.display = 'none';
                  }
                });
              });
              await page.screenshot({ path: `docs/website-preview/${file}.png`, fullPage: true });
              console.log(`captured ${url} -> docs/website-preview/${file}.png`);
            }
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          EOF
          node capture.js

      - name: Scrub and adjust README.md for the anonymous branch
        run: |
          cat > scrub.js <<'EOF'
          const fs = require('fs');

          const SLUGS = ['explorer', 'cost-analysis', 'genealogy', 'mpc-puzzle', 'related-work', 'bibliography'];
          // Matches the live-site domain whether written as a full https:// URL or as
          // bare display text, with or without the repo path segment / a page slug.
          const SITE_RE = /(?:https?:\/\/)?kuleuven-cosic\.github\.io(?:\/sok-ppml-mpc-frameworks)?\/?([a-z-]*)/g;

          let readme = fs.readFileSync('README.md', 'utf8');

          // 1. Drop badge lines whose own image text bakes in identifying info
          //    (Paper badge spells out the eprint ID; Live Site badge spells out the domain).
          readme = readme.split('\n').filter(l => !l.includes('Live%20Site') && !l.includes('Paper-ePrint')).join('\n');

          // 2. Replace every occurrence of the live-site domain with a local screenshot path.
          readme = readme.replace(SITE_RE, (match, slug) => {
            const file = slug && SLUGS.includes(slug) ? slug : 'home';
            return `docs/website-preview/${file}.png`;
          });
          // 2b. Tidy up the resulting self-referential links into readable "preview screenshot" links.
          readme = readme.replace(
            /\[docs\/website-preview\/([a-z-]+)\.png\]\(docs\/website-preview\/\1\.png\)/g,
            '[preview screenshot](docs/website-preview/$1.png)'
          );
          readme = readme.replace(
            '[live site](docs/website-preview/home.png)',
            '[captured screenshots](docs/website-preview/)'
          );

          // 3. Any link to this specific paper's eprint entry (not eprint.iacr.org in general,
          //    which is used throughout Bibliography/references.md for unrelated citations).
          //    Stop at markdown-special characters AND a trailing "." (sentence-ending
          //    punctuation directly after the URL, e.g. "...org/2025/1679." with no space),
          //    not just whitespace -- "[URL](URL)" has no whitespace between the two URL
          //    occurrences, and the trailing "}" in the bibtex url field is not part of the URL.
          readme = readme.replace(/https:\/\/eprint\.iacr\.org\/2025\/1679[^\s)\]}.]*/g, 'OMITTED_FOR_REVIEW');
          readme = readme.replace(/\[OMITTED_FOR_REVIEW\]\(OMITTED_FOR_REVIEW\)/g, 'the full version (omitted for double-blind review)');
          readme = readme.replace(/\[([^\]]*)\]\(OMITTED_FOR_REVIEW\)/g, '$1 (link omitted for double-blind review)');
          readme = readme.replace(/OMITTED_FOR_REVIEW/g, 'the full version (omitted for double-blind review)');
          readme = readme.replace(
            'The full version of our paper is available on the Cryptology ePrint Archive: the full version (omitted for double-blind review).',
            'The full version of this paper is omitted from this repository for double-blind review.'
          );
          readme = readme.replace(
            '— (see the full paper: the full version (omitted for double-blind review))',
            '(omitted for double-blind review)'
          );

          // 4. Reduce the citation block to just author (redacted) and title -- drop
          //    journal/year/url entirely, since venue + year + eprint report number
          //    together are still enough to look this specific paper up.
          readme = readme.replace(/author\s*=\s*\{[^}]*\}/, 'author       = {Anonymous Author(s)}');
          readme = readme.replace('@article{ZbudilaSYMAP25,', '@article{AnonymousSubmission,');
          readme = readme.split('\n').filter(l =>
            !/^\s*journal\s*=/.test(l) && !/^\s*year\s*=/.test(l) && !/^\s*url\s*=/.test(l)
          ).join('\n');
          // Whichever field ends up last (title, after journal/year/url are dropped) is left
          // with a dangling trailing comma before the entry's closing brace -- strip it.
          readme = readme.replace(/,(\n\}\n)/, '$1');

          // 5. Reinsert a "Paper appendix" column into the Contents table. main dropped this
          //    column deliberately (it's redundant for casual browsing), but reviewers on the
          //    anonymous branch are cross-referencing against the submitted paper and benefit
          //    from the appendix pointer, so this branch keeps it.
          const APPENDIX_MAP = [
            ['Notation', null],
            ['Related Work', 'Appendix A'],
            ['Decision Graph', 'Appendix C'],
            ['Design & Deployment Dimensions', 'Appendix C'],
            ['Genealogy', 'Appendix C'],
            ['ML-Based Systematization', 'Appendix D'],
            ['Theoretical Costs Analysis', 'Appendix D'],
            ['Unification and Conversions', 'Appendix E'],
            ['Bibliography', null],
          ];
          readme = readme.split('\n').map(line => {
            if (line.startsWith('| Topic | What it answers |')) {
              return line.replace('| Topic | What it answers |', '| Topic | What it answers | Paper appendix |');
            }
            if (/^\|\s*---\s*\|\s*---\s*\|\s*---\s*\|\s*:---:\s*\|\s*$/.test(line)) {
              return '| --- | --- | :---: | --- | :---: |';
            }
            if (line.startsWith('|')) {
              for (const [keyword, appendix] of APPENDIX_MAP) {
                if (line.includes(keyword)) {
                  const cells = line.split('|');
                  cells.splice(3, 0, appendix ? ` ${appendix} ` : ' — ');
                  return cells.join('|');
                }
              }
            }
            return line;
          }).join('\n');

          fs.writeFileSync('README.md', readme);
          console.log('README.md scrubbed.');
          EOF
          node scrub.js

          # LICENSE carries the real copyright holder on main; redact it back to a
          # placeholder for double-blind review.
          sed -i 's/Copyright (c) 2026 KU Leuven - COSIC/Copyright (c) 2026 XXXX/' LICENSE

          # This repo's own CI/workflow config isn't relevant to reviewers and is
          # excluded rather than audited line-by-line. The npm/Playwright install
          # artifacts and these helper scripts themselves must also not end up in
          # the orphan commit -- only docs/website-preview/*.png should survive.
          rm -rf .github node_modules package.json package-lock.json capture.js scrub.js

      - name: Safety net -- fail if any author/org fingerprint remains
        run: |
          # Author surnames: excludes Bibliography/references.md and Tables/, since both are
          # citation-heavy by design and routinely cite *other* papers co-authored by one of
          # this SoK's own authors (e.g. a table citing an unrelated prior work) -- normal
          # scholarly citation infrastructure, not an authorship leak, and DBLP-style
          # citation keys often embed author surnames as substrings.
          AUTHOR_PATTERN='Zbudila|Suresh|Yalame|Mirzamohammadi|Abidin|Preneel'
          AUTHOR_MATCHES=$(grep -rniE "$AUTHOR_PATTERN" . \
            --include='*.md' --include='*.yml' --include='*.yaml' --include='LICENSE' \
            --exclude-dir='.git' --exclude-dir='docs' --exclude-dir='Tables' \
            | grep -v '^\./Bibliography/references\.md:' || true)

          # Org name: checked everywhere, including LICENSE (real copyright holder on main).
          # Matches "KU Leuven" with or without a space/hyphen, and "kuleuven-cosic" for the
          # domain -- deliberately NOT a bare "github.io" check, which would false-positive
          # on unrelated citations that happen to link to other *.github.io sites.
          ORG_MATCHES=$(grep -rniE 'KU[ -]?Leuven|kuleuven-cosic' . \
            --include='*.md' --include='*.yml' --include='*.yaml' --include='LICENSE' \
            --exclude-dir='.git' --exclude-dir='docs' || true)

          # This specific paper's eprint link only, not eprint.iacr.org in general.
          EPRINT_MATCHES=$(grep -rniE 'eprint\.iacr\.org/2025/1679' . \
            --include='*.md' --include='*.yml' --include='*.yaml' --include='LICENSE' \
            --exclude-dir='.git' --exclude-dir='docs' || true)

          ALL_MATCHES=$(printf '%s\n%s\n%s\n' "$AUTHOR_MATCHES" "$ORG_MATCHES" "$EPRINT_MATCHES" | sed '/^$/d')
          if [ -n "$ALL_MATCHES" ]; then
            echo "Author/org fingerprint found:"
            echo "$ALL_MATCHES"
            echo ""
            echo "Aborting -- fix the scrub step above before re-running."
            exit 1
          fi
          echo "No author/org fingerprints found."

      - name: Build a single anonymous orphan commit
        run: |
          git config user.name "Anonymous"
          git config user.email "anonymous@example.com"

          git checkout --orphan anonymous-submission-tmp
          git add -A
          git commit -m "Anonymous submission snapshot"

          git branch -D anonymous-submission 2>/dev/null || true
          git branch -m anonymous-submission
          git push --force origin anonymous-submission

      - name: Job summary
        run: |
          {
            echo "## Anonymous submission branch updated"
            echo ""
            echo "- Pushed a single squashed commit to \`anonymous-submission\`, authored by a generic \`Anonymous\` identity (no real names or personal emails in the git history)."
            echo "- Scrubbed: README citation block (author + title only, no venue/year/link), eprint link, live-site badge/links (replaced with freshly captured screenshots under \`docs/website-preview/\`, with the site's footer and homepage author/citation section hidden before capture), and \`.github/\` workflow config."
            echo "- **This repo still lives under the \`KULeuven-COSIC\` GitHub org** -- sharing this branch's raw GitHub URL with reviewers would still reveal the affiliation. Submit via a URL-masking proxy such as https://anonymous.4open.science/ pointed at this repo + the \`anonymous-submission\` branch instead."
          } >> "$GITHUB_STEP_SUMMARY"
